[phases.setup]
nixPkgs = ['nodejs', 'npm']
aptPkgs = [
  'chromium',
  'libnss3',
  'libnspr4',
  'libatk1.0-0',
  'libatk-bridge2.0-0',
  'libcups2',
  'libdrm2',
  'libxkbcommon0',
  'libxcomposite1',
  'libxdamage1',
  'libxfixes3',
  'libxrandr2',
  'libgbm1',
  'libasound2',
  'libpango-1.0-0',
  'libcairo2'
]

[variables]
PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = 'true'
PDF_CHROME_BINARY = '/usr/bin/chromium'
